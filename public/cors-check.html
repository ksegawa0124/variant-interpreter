<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORS 実地確認</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; vertical-align: top; }
  .ok { color: #0a6b2b; font-weight: 600; }
  .ng { color: #b02a37; font-weight: 600; }
  code { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<h1>CORS 実地確認</h1>
<p>このページのオリジンからブラウザで各 API に GET し、CORS が許可されているかを判定します（Phase 2 手動確認用）。</p>
<button id="run">確認を実行</button>
<table>
  <thead><tr><th>API</th><th>結果</th><th>詳細</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const TESTS = [
  ['ClinGen Allele Registry', 'https://reg.clinicalgenome.org/allele?hgvs=NC_000017.11%3Ag.7674220C%3ET'],
  ['Ensembl VEP REST', 'https://rest.ensembl.org/vep/human/hgvs/17:g.7674220C%3ET?content-type=application/json'],
  ['MyVariant.info', 'https://myvariant.info/v1/query?q=rs11540652&assembly=hg38&fields=_id'],
  ['Broad SpliceAI lookup', 'https://spliceai-38-xwkwwwxdwq-uc.a.run.app/spliceai/?hg=38&variant=chr17-7674221-G-A&distance=500&mask=0'],
  ['ClinGen ERepo', 'https://erepo.clinicalgenome.org/evrepo/api/classifications?matchMode=exact&gene=TP53'],
];
const rows = document.getElementById('rows');
document.getElementById('run').onclick = async () => {
  rows.innerHTML = '';
  for (const [name, url] of TESTS) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}<br><code>${url}</code></td><td>…</td><td></td>`;
    rows.appendChild(tr);
    const t0 = performance.now();
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 45000);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      tr.children[1].innerHTML = `<span class="ok">CORS OK</span>`;
      tr.children[2].textContent = `HTTP ${r.status} / ${Math.round(performance.now() - t0)} ms`;
    } catch (e) {
      tr.children[1].innerHTML = `<span class="ng">失敗</span>`;
      tr.children[2].textContent = `${e.name}: ${e.message}（CORS 拒否・ネットワーク不通・タイムアウトのいずれか。DevTools の Console / Network で区別）`;
    }
  }
};
</script>
</body>
</html>
